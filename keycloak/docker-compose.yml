services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ["start-dev", "--import-realm"]
    ports:
      - "8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # host.docker.internal also resolves to IPv6, which the container cannot route;
      # without this the JVM picks IPv6 first and back-channel logout fails.
      JAVA_OPTS_APPEND: "-Djava.net.preferIPv4Stack=true"
      # Theme hot-reload while iterating on the Keycloakify JAR.
      KC_SPI_THEME_CACHE_THEMES: "false"
      KC_SPI_THEME_CACHE_TEMPLATES: "false"
      KC_SPI_THEME_STATIC_MAX_AGE: "-1"
    volumes:
      # Realm "next" with the confidential client + a test user (imported only if absent).
      - ./import:/opt/keycloak/data/import:ro
      # Keycloakify output: pnpm build:theme copies the JAR here.
      - ./providers:/opt/keycloak/providers
    extra_hosts:
      # Lets Keycloak reach the app on the host for back-channel logout.
      - "host.docker.internal:host-gateway"
